name: quadratic_equation_solver
description: Мобильное приложение для обучения решению квадратных уравнений с использованием ИИ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # HTTP requests
  http: ^1.1.0
  dio: ^5.3.2
  
  # Image handling
  image_picker: ^1.0.4
  image: ^4.1.3
  google_mlkit_text_recognition: ^0.15.1
  path_provider: ^2.0.0
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # Localization
  intl: ^0.20.2
  easy_localization: ^3.0.3
  
  # UI utilities
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  
  # Validation
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.1.2
  js: ^0.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
